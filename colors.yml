# Desired state for n8n-vultr. Non-secret values only.
# Credentials belong in the gitignored .envrc.private as COLORS_PAR_* variables.
# Never export COLORS_PAR_PROFILE: it selects this deployment's remote state.
#
# Required credentials:
#   Vultr           COLORS_PAR_VULTR_API_KEY
#   Cloudflare      COLORS_PAR_CLOUDFLARE_API_TOKEN
#   state in R2     COLORS_PAR_R2_ACCESS_KEY_ID
#                   COLORS_PAR_R2_SECRET_ACCESS_KEY
#   Neon data       COLORS_PAR_NEON_R2_ACCESS_KEY_ID      (optional)
#   in R2           COLORS_PAR_NEON_R2_SECRET_ACCESS_KEY  (optional)
#   backups in R2   COLORS_PAR_N8N_BACKUP_R2_ACCESS_KEY_ID      (optional)
#                   COLORS_PAR_N8N_BACKUP_R2_SECRET_ACCESS_KEY  (optional)
#                   Either pair falls back to COLORS_PAR_R2_* when unset,
#                   which is the current state: one pair reaches OpenTofu
#                   state, live Neon data, and backups alike. Splitting them
#                   is the hardening path -- see README. These are two
#                   SEPARATE pairs, one per bucket; the names are what the
#                   code reads, so a near-miss silently leaves the shared
#                   credential in place.
#   n8n secret      COLORS_PAR_N8N_ENCRYPTION_KEY
#                   (>= 32 chars; encrypts stored node credentials. LOSING THIS
#                   MAKES EVERY SAVED CREDENTIAL UNDECRYPTABLE -- it is not
#                   regenerable, back it up outside this machine.)
#
# The Postgres role passwords, the n8n owner-account password, and the task
# runner auth token are generated on the server during convergence (create-once
# under /etc/n8n/secrets/) and are not operator-supplied; retrieve them over
# SSH. See README.

profile: n8n
workdir: .colors

provider-compute: vultr
provider-dns: cloudflare
provider-backend: r2

# One R2 credential reaching OpenTofu state, live Neon data and backups alike
# is refused unless this says `shared-accepted`. Leave it at `split` and supply
# COLORS_PAR_NEON_R2_* and COLORS_PAR_N8N_BACKUP_R2_* scoped to one bucket
# each: a backup a compromised host can erase is not a backup.
r2-credential-sharing: split

# Preserve this guard in committed desired state. Destruction requires an
# explicitly authorized one-run override; never edit this flag to bypass it.
compute-prevent-destroy: true

# --- n8n --------------------------------------------------------------------

# 2.36.9 released 2026-08-31 and is the release upstream tags `stable`.
# Digest-pinned: the version tag is mutable and n8n republishes it.
n8n-image: docker.io/n8nio/n8n:2.36.9@sha256:a9e2e3c8006ed453238266669ea1274be7136f515abe290a2f75a0ab9044c93d

# n8n 2.0 removed the task runner for external mode from the main image, so
# external mode is a second container. Internal mode would run Code nodes in
# the main process under the same uid, with read access to the environment
# that holds the encryption key; upstream calls that unsuitable for production.
# The runner train is versioned with the main image -- move the pair together.
n8n-runners-image: docker.io/n8nio/runners:2.36.9@sha256:99811ba57933dd77895f5fedbb555ce105bac8a82812205f6396d52a30b32e66

n8n-host: n8n.example.com
n8n-port: 5678

# The account convergence claims before Caddy is published. n8n's first-run
# setup screen is unauthenticated: whoever reaches it first owns the instance
# and every credential it will ever store. The password is generated on the
# server (create-once, /etc/n8n/secrets/), so this is desired state, not a
# credential. Re-running is safe: already-claimed is success.
n8n-owner-email: operator@example.com

# Behind Cloudflare AND Caddy there are two proxies in front of n8n. n8n's
# default is 0, which makes it trust the nearest hop and mis-attribute client
# addresses; webhook URLs and rate limiting both depend on getting this right.
n8n-proxy-hops: 2

# n8n keeps its settings file and binary-data staging here even on Postgres;
# it is not optional and it is not where the workflows live.
n8n-data-dir: /var/lib/n8n/data

# Timezone for cron-triggered workflows. A schedule means nothing without it,
# and n8n's own default is America/New_York.
n8n-timezone: Europe/Amsterdam

# --- Execution data, and the two settings that actually cause OOM -------------
#
# Pruning is already on upstream (EXECUTIONS_DATA_PRUNE defaults true, 336h,
# 10000 executions), so the execution table is not the danger on this host.
# These two are, and both default to the unsafe value:
#
#   N8N_DEFAULT_BINARY_DATA_MODE defaults to `default`, which holds binary
#   payloads IN MEMORY. A Code node duplicates its payload twice, so a 100 MB
#   payload transiently costs ~300 MB.
#   N8N_CONCURRENCY_PRODUCTION_LIMIT defaults to -1, i.e. unlimited.
#
# Peak memory is roughly 3x the largest payload times the concurrency bound.
# That product is what sizes the machine -- not the average workload.
n8n-binary-data-mode: filesystem
n8n-concurrency-production-limit: 10

# Retention. Left at upstream's values deliberately; stated here so a change is
# a desired-state edit rather than an undocumented drift. Age is in HOURS.
n8n-executions-data-max-age: 336
n8n-executions-data-prune-max-count: 10000

# Pruning is soft-delete then hard-delete, and on Neon those deletes are WAL,
# and WAL ships to R2. Pruning is a continuous write amplifier against object
# storage here in a way plain-Postgres guidance never has to mention.

# --- Security -----------------------------------------------------------------
#
# n8n's environment-variable reference shows all three of these defaulting to
# false, contradicting the 2.0 breaking-changes page. Rendered explicitly so the
# deployment does not inherit whatever a future release decides.
n8n-block-env-access-in-node: true
n8n-enforce-settings-file-permissions: true
n8n-git-node-disable-bare-repos: true
n8n-restrict-file-access-to: /home/node/.n8n-files

caddy-image: docker.io/library/caddy:2.11.4@sha256:df7f1c2fb114453b951de51a98efc010db1655a92c2e86be6706714e2417a78d

# --- Neon (colocated storage tier) -------------------------------------------

# n8n's database is a self-hosted Neon: a storage broker, a pageserver, one
# safekeeper, and a Postgres 17 compute node, with layers and WAL in R2.
# Everything binds loopback or the internal Docker network; nothing is public.
#
# The verified-good pairing from the neon-vultr build (2026-08-31). Upstream
# cut its last versioned releases in July 2025 and then moved to untagged
# continuous deployment, so these are the final deliberate release tags of
# each train. Storage and compute version independently: move both together
# or neither, and re-read upstream's compose tree at any new storage tag.
neon-image: ghcr.io/neondatabase/neon:release-9129@sha256:166022a72bf9983eba96d061d794f4740edbd4c3301e66202c1180acce9a323c
neon-compute-image: ghcr.io/neondatabase/compute-node-v17:release-compute-9073@sha256:ed6a613231d7026b4df8b00563444b9f33745370a3b3f0a2183e723f460ba974
neon-pg-version: 17

# Tenant and timeline identities are desired state, not runtime accidents.
# The R2 prefix plus these ids ARE the database: fixing them here is what makes
# convergence reconcilable (create-if-absent, verify-if-present) and recovery
# describable. Non-secret 32-hex identifiers, distinct from neon-vultr's.
neon-tenant-id: 7b3c1e94a05d42f8b6c9e2417d580a3f
neon-timeline-id: 4f8a2d61c93b47e0a5d8f1620b7c94e3

# The database and role convergence creates on the compute node for n8n.
# The role password is generated on the server; cloud_admin keeps its own.
neon-database: n8n
neon-role: n8n

# --- Neon data and backups in R2 ---------------------------------------------

# Pageserver layers and safekeeper WAL, under this deployment's <profile>/
# prefix, plus the six-hourly logical backup under <profile>/backup/.
# Never configure R2 lifecycle rules on this bucket: they would delete live
# layers and WAL that Neon still references.
#
# Dedicated buckets, unlike neon-vultr which put Neon data in the shared
# OpenTofu state bucket. Verified live 2026-09-01: the configured credential can
# PUT and DELETE under both, and ListBuckets is DENIED -- so no template may
# list or create a bucket, only address objects under a known name.
#
# These keys are deliberately named `neon-*`, not `n8n-*`: this deployment
# renders the getcolors/neon package's own templates directly off the classpath
# rather than carrying a copy of them, so it must speak that package's key
# vocabulary. Renaming them here would fork the templates by the back door.
neon-r2-bucket: n8n-storage-example
neon-r2-endpoint: https://319271fed8bc6d2d9059362be1165f37.eu.r2.cloudflarestorage.com
neon-r2-region: auto
neon-r2-prefix: n8n/data

# This is the FIRST line of disaster recovery, not the second. Neon streams WAL
# to R2 continuously, but the neon-single-node fresh-safekeeper rehearsal proved
# a rebuilt safekeeper does NOT recover its offloaded WAL -- the walproposer
# bootstraps it from the compute basebackup instead. So a destroyed host falls
# back to this dump, and the backup INTERVAL is the real RPO. Six hours, not
# nightly: a 24-hour RPO on a system holding live third-party credentials is not
# defensible, and the dump is small.
n8n-backup-r2-bucket: n8n-backup-example
n8n-backup-oncalendar: "*-*-* 00/6:00:00"
n8n-backup-retention-days: 7
n8n-backup-dir: /var/backups/n8n

# --- Public DNS and TLS -------------------------------------------------------

cloudflare-zone: example.com
cloudflare-record-name: n8n

# Serve through the Cloudflare proxy so the instance's address is not published
# in DNS. The Caddyfile trusts Cloudflare's ranges, so client addresses still
# come from X-Forwarded-For rather than the edge. Note that SSH to the hostname
# stops resolving to the instance once this is on -- converges are unaffected
# because Ansible uses the address OpenTofu outputs, but an ad-hoc ssh needs
# the origin address.
cloudflare-proxied: true

# --- Vultr --------------------------------------------------------------------

# No vultr-name: per workspace standards/compute-name.md the machine and its
# firewall are named after the profile.
vultr-region: ams

# neon-vultr records that 4 GiB invites bootstrap OOM for the Neon tier alone;
# n8n's main process, the task runner, and Caddy sit on top of it here.
#
# NVMe, not SSD: Vultr's vc2-* line is SSD, and the pageserver is a random-read
# engine whose entire job is serving pages. In ams this plan is 8 cores /
# 16 GiB / 350 GB AMDHIGHPERF NVMe at $96/mo, against vc2-6c-16gb's 6 cores and
# SSD at $80 -- two more cores and NVMe for $16.
#
# 16 GiB is the floor, not a margin. The soak gate decides whether it holds; if
# it fails its memory threshold the answer is vhf-8c-32gb, not tuning. Vultr
# plan changes are an in-place upgrade, so that escalation is cheap.
vultr-plan: vhp-8c-16gb-amd
# Vultr operating systems are numeric ids; 2284 is Ubuntu 24.04 LTS x64.
vultr-os-id: 2284

# No vultr-ssh-keys: keygen mode per workspace standards/ssh-keypair.md. The
# package generates and owns ~/.ssh/n8n-vultr and registers the account key
# resource named after the profile. Setting vultr-ssh-keys here would switch
# this deployment to opt-out mode.

# SSH is key-only and used for convergence and recovery. HTTP(S) is public --
# unlike neon-vultr, this deployment serves a public application.
# Vultr firewalls are default-deny inbound and model no outbound at all.
vultr-ssh-sources:
  - 0.0.0.0/0
  - "::/0"
# Origin ingress is restricted to Cloudflare's published ranges. cloudflare-
# proxied hides the origin address from DNS but does nothing if the origin
# answers the whole internet: anyone who finds the address bypasses the edge and
# can forge X-Forwarded-For, which is exactly the header Caddy is told to trust.
# `cloudflare` is a symbolic source the package RESOLVES at converge time -- not
# a pinned range list, which this comment previously and wrongly implied. The
# resolved set, its fetch time and its checksum are recorded in generated
# metadata under .colors/ so a firewall change is explainable afterwards, and a
# failed or malformed fetch fails the converge rather than falling back to a
# permissive rule.
vultr-http-sources: cloudflare

# --- OpenTofu state backend ---------------------------------------------------

r2-bucket: tofu-state-example
r2-endpoint: https://319271fed8bc6d2d9059362be1165f37.eu.r2.cloudflarestorage.com

# --- Soak gate thresholds -----------------------------------------------------
#
# The blocking gate that decides whether self-hosted Neon is actually a suitable
# n8n database on one host, rather than deferring the question to prose. Failing
# any threshold fails the converge.
# A declared workload MIX, not just a count: a bare count of small executions
# can meet every threshold without ever exercising the two things that actually
# break this host -- Code-node memory multiplication and binary-data churn.
n8n-soak-concurrent-workflows: 10
n8n-soak-duration-seconds: 300
n8n-soak-mix-api-percent: 60
n8n-soak-mix-code-node-percent: 25
n8n-soak-mix-binary-percent: 15
n8n-soak-code-node-payload-mb: 8
n8n-soak-binary-payload-mb: 4
# Two DISTINCT measurements. "Database latency" is otherwise whatever is
# easiest to report: SQL round-trip and end-to-end execution duration are not
# the same number and do not fail for the same reasons.
n8n-soak-max-p95-sql-roundtrip-ms: 150
n8n-soak-max-p99-sql-roundtrip-ms: 500
n8n-soak-max-p95-execution-ms: 2000
n8n-soak-max-p99-execution-ms: 8000
n8n-soak-min-executions-completed: 500
n8n-soak-max-host-memory-percent: 85
n8n-soak-max-disk-percent: 80
